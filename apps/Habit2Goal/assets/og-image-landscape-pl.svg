<?xml version="1.0" encoding="UTF-8"?>
<!-- TEMPLATE landscape 1200×630 — copy lives in strings.json; run build.mjs. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" lang="pl">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1B2A"/><stop offset="0.5" stop-color="#112236"/><stop offset="1" stop-color="#0A1622"/>
    </linearGradient>
    <radialGradient id="glow-teal" cx="0.15" cy="0.15" r="0.6">
      <stop offset="0" stop-color="#00C896" stop-opacity="0.45"/><stop offset="1" stop-color="#00C896" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-orange" cx="0.92" cy="0.85" r="0.5">
      <stop offset="0" stop-color="#FF8C42" stop-opacity="0.32"/><stop offset="1" stop-color="#FF8C42" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="teal-text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00C896"/><stop offset="1" stop-color="#5FF1C5"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#00C896" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/><feOffset dx="0" dy="14" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cta-glow" x="-40%" y="-60%" width="180%" height="220%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/><feOffset dx="0" dy="6" result="b"/>
      <feFlood flood-color="#00C896" flood-opacity="0.45"/><feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="screen-back"><rect x="10" y="10" width="210" height="467" rx="26"/></clipPath>
    <clipPath id="screen-front"><rect x="11" y="11" width="226" height="503" rx="27"/></clipPath>
    <clipPath id="clip-icon"><rect x="0" y="-26" width="48" height="48" rx="11"/></clipPath>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow-teal)"/>
  <rect width="1200" height="630" fill="url(#glow-orange)"/>

  <!-- Phones -->
  <g transform="translate(792 96) rotate(-7)" filter="url(#card-shadow)">
    <rect x="0" y="0" width="230" height="487" rx="36" fill="#0A1622" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2"/>
    <image href="screenshots/goal-progress.png" x="10" y="10" width="210" height="467" preserveAspectRatio="xMidYMid slice" clip-path="url(#screen-back)"/>
  </g>
  <g transform="translate(896 64)" filter="url(#card-shadow)">
    <rect x="0" y="0" width="248" height="525" rx="38" fill="#0A1622" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="2"/>
    <image href="screenshots/today.png" x="11" y="11" width="226" height="503" preserveAspectRatio="xMidYMid slice" clip-path="url(#screen-front)"/>
  </g>

  <!-- Copy (left column) -->
  <g font-family="Helvetica, Arial, sans-serif">
    <g transform="translate(72 78)">
      <rect x="0" y="0" width="235" height="36" rx="18" fill="#00C896" fill-opacity="0.10" stroke="#00C896" stroke-opacity="0.30"/>
      <circle cx="20" cy="18" r="4" fill="#00C896"/>
      <text x="36" y="24" font-size="14" font-weight="700" fill="#00C896" letter-spacing="2.5">EKONOMIA NAWYKÓW</text>
    </g>

    <text x="72" y="190" font-size="64" font-weight="900" fill="#FFFFFF" letter-spacing="-1.5">Buduj nawyki.</text>
    <text x="72" y="262" font-size="64" font-weight="900" fill="#FFFFFF" letter-spacing="-1.5">Zdobywaj punkty.</text>
    <text x="72" y="334" font-size="64" font-weight="900" fill="url(#teal-text)" letter-spacing="-1.5">Kup, co chcesz.</text>

    <text x="72" y="388" font-size="21" fill="#FFFFFF" fill-opacity="0.74">Zamień codzienne nawyki w punkty,</text>
    <text x="72" y="417" font-size="21" fill="#FFFFFF" fill-opacity="0.74">które finansują wybrane przez Ciebie nagrody.</text>

    <g transform="translate(72 452)" filter="url(#cta-glow)">
      <rect x="0" y="0" width="299" height="56" rx="28" fill="url(#teal-text)"/>
      <text x="149.5" y="36" text-anchor="middle" font-size="21" font-weight="800" fill="#06231B">Pobierz za darmo  ↓</text>
    </g>
    <text x="397" y="486" font-size="16" font-weight="600" fill="#FFFFFF" fill-opacity="0.62">Za darmo · iOS i Android</text>
  </g>

  <g transform="translate(72 576)" font-family="Helvetica, Arial, sans-serif">
    <rect x="0" y="-26" width="48" height="48" rx="11" fill="#0F1C2C" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <image href="app-icon.png" x="0" y="-26" width="48" height="48" clip-path="url(#clip-icon)"/>
    <text x="64" y="-2" font-size="22" font-weight="800" fill="#FFFFFF">Habit2Goal</text>
    <text x="64" y="22" font-size="14" fill="#FFFFFF" fill-opacity="0.55" letter-spacing="0.5">nowakapps.com/apps/Habit2Goal</text>
  </g>
</svg>
