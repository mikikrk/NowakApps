<?xml version="1.0" encoding="UTF-8"?>
<!-- TEMPLATE square 1080×1080 — copy lives in strings.json; run build.mjs. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080" lang="pl">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1B2A"/><stop offset="0.5" stop-color="#112236"/><stop offset="1" stop-color="#0A1622"/>
    </linearGradient>
    <radialGradient id="glow-teal" cx="0.18" cy="0.12" r="0.6">
      <stop offset="0" stop-color="#00C896" stop-opacity="0.42"/><stop offset="1" stop-color="#00C896" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-orange" cx="0.85" cy="0.92" r="0.55">
      <stop offset="0" stop-color="#FF8C42" stop-opacity="0.30"/><stop offset="1" stop-color="#FF8C42" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="teal-text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00C896"/><stop offset="1" stop-color="#5FF1C5"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#00C896" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16"/><feOffset dx="0" dy="16" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cta-glow" x="-40%" y="-60%" width="180%" height="220%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="11"/><feOffset dx="0" dy="6" result="b"/>
      <feFlood flood-color="#00C896" flood-opacity="0.45"/><feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="screen-back"><rect x="9" y="9" width="152" height="360" rx="22"/></clipPath>
    <clipPath id="screen-front"><rect x="9" y="9" width="170" height="400" rx="24"/></clipPath>
    <clipPath id="clip-icon"><rect x="-26" y="0" width="52" height="52" rx="12"/></clipPath>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="url(#grid)"/>
  <rect width="1080" height="1080" fill="url(#glow-teal)"/>
  <rect width="1080" height="1080" fill="url(#glow-orange)"/>

  <!-- Copy (centred) -->
  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle">
    <g transform="translate(418 66)" text-anchor="start">
      <rect x="0" y="0" width="245" height="36" rx="18" fill="#00C896" fill-opacity="0.10" stroke="#00C896" stroke-opacity="0.30"/>
      <circle cx="20" cy="18" r="4" fill="#00C896"/>
      <text x="36" y="24" font-size="15" font-weight="700" fill="#00C896" letter-spacing="2.5">EKONOMIA NAWYKÓW</text>
    </g>

    <text x="540" y="190" font-size="72" font-weight="900" fill="#FFFFFF" letter-spacing="-1.5">Buduj nawyki.</text>
    <text x="540" y="274" font-size="72" font-weight="900" fill="#FFFFFF" letter-spacing="-1.5">Zdobywaj punkty.</text>
    <text x="540" y="358" font-size="72" font-weight="900" fill="url(#teal-text)" letter-spacing="-1.5">Kup, co chcesz.</text>

    <text x="540" y="416" font-size="23" fill="#FFFFFF" fill-opacity="0.74">Zamień codzienne nawyki w punkty,</text>
    <text x="540" y="448" font-size="23" fill="#FFFFFF" fill-opacity="0.74">które finansują wybrane przez Ciebie nagrody.</text>
  </g>

  <!-- Phones (centred) -->
  <g transform="translate(356 498) rotate(-7)" filter="url(#card-shadow)">
    <rect x="0" y="0" width="170" height="378" rx="30" fill="#0A1622" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2"/>
    <image href="screenshots/goal-progress.png" x="9" y="9" width="152" height="360" preserveAspectRatio="xMidYMid slice" clip-path="url(#screen-back)"/>
  </g>
  <g transform="translate(452 476)" filter="url(#card-shadow)">
    <rect x="0" y="0" width="188" height="418" rx="32" fill="#0A1622" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="2"/>
    <image href="screenshots/today.png" x="9" y="9" width="170" height="400" preserveAspectRatio="xMidYMid slice" clip-path="url(#screen-front)"/>
  </g>

  <!-- Download CTA (centred) -->
  <g font-family="Helvetica, Arial, sans-serif">
    <g transform="translate(379 920)" filter="url(#cta-glow)">
      <rect x="0" y="0" width="322" height="58" rx="29" fill="url(#teal-text)"/>
      <text x="161" y="38" text-anchor="middle" font-size="23" font-weight="800" fill="#06231B">Pobierz za darmo  ↓</text>
    </g>
    <text x="540" y="1010" text-anchor="middle" font-size="18" font-weight="600" fill="#FFFFFF" fill-opacity="0.62">Za darmo · iOS i Android</text>

    <!-- Footer brand -->
    <text x="540" y="1052" text-anchor="middle" font-size="16" fill="#FFFFFF" fill-opacity="0.5" letter-spacing="0.5"><tspan font-weight="800" fill="#FFFFFF" fill-opacity="0.85">Habit2Goal</tspan>  ·  nowakapps.com/apps/Habit2Goal</text>
  </g>
</svg>
