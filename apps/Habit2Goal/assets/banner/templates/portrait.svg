<?xml version="1.0" encoding="UTF-8"?>
<!-- TEMPLATE portrait 1080×1350 — copy lives in strings.json; run build.mjs. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" lang="{{lang}}">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1B2A"/><stop offset="0.5" stop-color="#112236"/><stop offset="1" stop-color="#0A1622"/>
    </linearGradient>
    <radialGradient id="glow-teal" cx="0.18" cy="0.10" r="0.55">
      <stop offset="0" stop-color="#00C896" stop-opacity="0.42"/><stop offset="1" stop-color="#00C896" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-orange" cx="0.85" cy="0.94" r="0.5">
      <stop offset="0" stop-color="#FF8C42" stop-opacity="0.30"/><stop offset="1" stop-color="#FF8C42" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="teal-text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00C896"/><stop offset="1" stop-color="#5FF1C5"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#00C896" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/><feOffset dx="0" dy="18" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cta-glow" x="-40%" y="-60%" width="180%" height="220%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/><feOffset dx="0" dy="7" result="b"/>
      <feFlood flood-color="#00C896" flood-opacity="0.45"/><feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="screen-back"><rect x="11" y="11" width="192" height="454" rx="26"/></clipPath>
    <clipPath id="screen-front"><rect x="11" y="11" width="214" height="504" rx="28"/></clipPath>
    <clipPath id="clip-icon"><rect x="-27" y="0" width="54" height="54" rx="12"/></clipPath>
  </defs>

  <rect width="1080" height="1350" fill="url(#bg)"/>
  <rect width="1080" height="1350" fill="url(#grid)"/>
  <rect width="1080" height="1350" fill="url(#glow-teal)"/>
  <rect width="1080" height="1350" fill="url(#glow-orange)"/>

  <!-- Copy (centred) -->
  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle">
    <g transform="translate({{eyebrowX}} 96)" text-anchor="start">
      <rect x="0" y="0" width="{{eyebrowWidth}}" height="40" rx="20" fill="#00C896" fill-opacity="0.10" stroke="#00C896" stroke-opacity="0.30"/>
      <circle cx="22" cy="20" r="4.5" fill="#00C896"/>
      <text x="40" y="27" font-size="{{eyebrowFont}}" font-weight="700" fill="#00C896" letter-spacing="2.5">{{eyebrow}}</text>
    </g>

    <text x="540" y="280" font-size="{{headlineSize}}" font-weight="900" fill="#FFFFFF" letter-spacing="-1.5">{{h1}}</text>
    <text x="540" y="384" font-size="{{headlineSize}}" font-weight="900" fill="#FFFFFF" letter-spacing="-1.5">{{h2}}</text>
    <text x="540" y="488" font-size="{{headlineSize}}" font-weight="900" fill="url(#teal-text)" letter-spacing="-1.5">{{h3}}</text>

    <text x="540" y="556" font-size="26" fill="#FFFFFF" fill-opacity="0.74">{{sub1}}</text>
    <text x="540" y="592" font-size="26" fill="#FFFFFF" fill-opacity="0.74">{{sub2}}</text>
  </g>

  <!-- Phones (centred) -->
  <g transform="translate(300 664) rotate(-7)" filter="url(#card-shadow)">
    <rect x="0" y="0" width="214" height="476" rx="34" fill="#0A1622" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2"/>
    <image href="screenshots/goal-progress.png" x="11" y="11" width="192" height="454" preserveAspectRatio="xMidYMid slice" clip-path="url(#screen-back)"/>
  </g>
  <g transform="translate(422 636)" filter="url(#card-shadow)">
    <rect x="0" y="0" width="236" height="526" rx="36" fill="#0A1622" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="2"/>
    <image href="screenshots/today.png" x="11" y="11" width="214" height="504" preserveAspectRatio="xMidYMid slice" clip-path="url(#screen-front)"/>
  </g>

  <!-- Download CTA + footer (centred) -->
  <g font-family="Helvetica, Arial, sans-serif">
    <g transform="translate({{ctaX}} 1188)" filter="url(#cta-glow)">
      <rect x="0" y="0" width="{{ctaWidth}}" height="64" rx="32" fill="url(#teal-text)"/>
      <text x="{{ctaHalf}}" y="42" text-anchor="middle" font-size="{{ctaFont}}" font-weight="800" fill="#06231B">{{cta}}  ↓</text>
    </g>
    <text x="{{storesX}}" y="1290" text-anchor="middle" font-size="20" font-weight="600" fill="#FFFFFF" fill-opacity="0.62">{{stores}}</text>

    <text x="540" y="1328" text-anchor="middle" font-size="17" fill="#FFFFFF" fill-opacity="0.5" letter-spacing="0.5"><tspan font-weight="800" fill="#FFFFFF" fill-opacity="0.85">Habit2Goal</tspan>  ·  {{tagline}}</text>
  </g>
</svg>
