<?xml version="1.0" encoding="UTF-8"?>
<!-- TEMPLATE story-personal 1080×1920 (9:16) — fun, founder/personal-voice ad.
     Copy lives in strings.json (locale pl-personal); run build.mjs.
     Decorative stickers/confetti are PL-specific and baked in here. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" lang="{{lang}}">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#0D1B2A"/><stop offset="0.5" stop-color="#112236"/><stop offset="1" stop-color="#0A1622"/>
    </linearGradient>
    <radialGradient id="glow-teal" cx="0.2" cy="0.06" r="0.5">
      <stop offset="0" stop-color="#00C896" stop-opacity="0.42"/><stop offset="1" stop-color="#00C896" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-orange" cx="0.86" cy="0.55" r="0.4">
      <stop offset="0" stop-color="#FF8C42" stop-opacity="0.26"/><stop offset="1" stop-color="#FF8C42" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="teal-text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00C896"/><stop offset="1" stop-color="#5FF1C5"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD66B"/><stop offset="1" stop-color="#F5A623"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB066"/><stop offset="1" stop-color="#FF8C42"/>
    </linearGradient>
    <pattern id="grid" width="54" height="54" patternUnits="userSpaceOnUse">
      <path d="M 54 0 L 0 0 0 54" fill="none" stroke="#00C896" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="sticker-shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/><feOffset dx="0" dy="6" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="20"/><feOffset dx="0" dy="20" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cta-glow" x="-40%" y="-60%" width="180%" height="220%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/><feOffset dx="0" dy="8" result="b"/>
      <feFlood flood-color="#00C896" flood-opacity="0.5"/><feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip-icon"><rect x="-44" y="0" width="88" height="88" rx="20"/></clipPath>
    <clipPath id="screen-back"><rect x="10" y="10" width="200" height="468" rx="28"/></clipPath>
    <clipPath id="screen-front"><rect x="11" y="11" width="222" height="512" rx="30"/></clipPath>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg)"/>
  <rect width="1080" height="1920" fill="url(#grid)"/>
  <rect width="1080" height="1920" fill="url(#glow-teal)"/>
  <rect width="1080" height="1920" fill="url(#glow-orange)"/>

  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle">
    <!-- App icon -->
    <g transform="translate(540 88) rotate(-4)">
      <rect x="-44" y="0" width="88" height="88" rx="20" fill="#0F1C2C" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <image href="app-icon.png" x="-44" y="0" width="88" height="88" clip-path="url(#clip-icon)"/>
    </g>

    <!-- Headline — the debut hook (2 lines) -->
    <text x="540" y="316" font-size="{{headlineSize}}" font-weight="900" fill="#FFFFFF" letter-spacing="-1.5">{{h1}}</text>
    <text x="540" y="422" font-size="{{headlineSize}}" font-weight="900" fill="url(#teal-text)" letter-spacing="-1.5">{{h2}}</text>

    <!-- "#1 app" seal -->
    <g transform="translate(986 308) rotate(-11)" filter="url(#sticker-shadow)">
      <circle r="54" fill="url(#gold)"/>
      <circle r="54" fill="none" stroke="#3A2600" stroke-opacity="0.35" stroke-width="3"/>
      <text y="-1" font-size="36" font-weight="900" fill="#3A2600">#1</text>
      <text y="28" font-size="15" font-weight="800" fill="#3A2600" letter-spacing="1.5">APKA</text>
    </g>

    <!-- Product + inspiration -->
    <text x="540" y="494" font-size="27"><tspan font-weight="900" fill="url(#teal-text)">{{product}}</tspan><tspan font-weight="700" fill="#FFFFFF" fill-opacity="0.86"> — {{productTag}}</tspan></text>
    <text x="540" y="534" font-size="24" fill="#FFFFFF" fill-opacity="0.6">{{inspired}}</text>
  </g>

  <!-- ===== Phones scene with fun stickers ===== -->
  <!-- Back phone: goal-progress, tilted left -->
  <g transform="translate(322 614) rotate(-9)" filter="url(#card-shadow)">
    <rect x="0" y="0" width="220" height="488" rx="34" fill="#0A1622" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2"/>
    <image href="screenshots/goal-progress.png" x="10" y="10" width="200" height="468" preserveAspectRatio="xMidYMid slice" clip-path="url(#screen-back)"/>
  </g>
  <!-- Front phone: today, tilted right -->
  <g transform="translate(454 600) rotate(4)" filter="url(#card-shadow)">
    <rect x="0" y="0" width="244" height="534" rx="36" fill="#0A1622" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="2"/>
    <image href="screenshots/today.png" x="11" y="11" width="222" height="512" preserveAspectRatio="xMidYMid slice" clip-path="url(#screen-front)"/>
  </g>

  <!-- Floating sticker callout -->
  <g font-family="Helvetica, Arial, sans-serif" filter="url(#sticker-shadow)">
    <!-- Cel: ekspres (orange) -->
    <g transform="translate(266 1016) rotate(-5)">
      <rect x="0" y="0" width="206" height="54" rx="27" fill="url(#orange)"/>
      <circle cx="30" cy="27" r="13" fill="none" stroke="#3A1A00" stroke-width="3.5"/>
      <circle cx="30" cy="27" r="4" fill="#3A1A00"/>
      <text x="118" y="36" text-anchor="middle" font-size="24" font-weight="800" fill="#3A1A00">Cel: ekspres</text>
    </g>
  </g>

  <!-- ===== The 3-step concept (sticker cards) ===== -->
  <g font-family="Helvetica, Arial, sans-serif">
    <g transform="translate(120 1206)">
      <rect x="0" y="0" width="840" height="92" rx="22" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.10"/>
      <rect x="18" y="18" width="56" height="56" rx="15" fill="url(#teal-text)"/>
      <text x="46" y="56" text-anchor="middle" font-size="30" font-weight="900" fill="#06231B">1</text>
      <text x="98" y="56" font-size="30" font-weight="600" fill="#FFFFFF" fill-opacity="0.94">{{step1}}</text>
    </g>
    <g transform="translate(120 1314)">
      <rect x="0" y="0" width="840" height="92" rx="22" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.10"/>
      <rect x="18" y="18" width="56" height="56" rx="15" fill="url(#teal-text)"/>
      <text x="46" y="56" text-anchor="middle" font-size="30" font-weight="900" fill="#06231B">2</text>
      <text x="98" y="56" font-size="30" font-weight="600" fill="#FFFFFF" fill-opacity="0.94">{{step2}}</text>
    </g>
    <g transform="translate(120 1422)">
      <rect x="0" y="0" width="840" height="92" rx="22" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.10"/>
      <rect x="18" y="18" width="56" height="56" rx="15" fill="url(#teal-text)"/>
      <text x="46" y="56" text-anchor="middle" font-size="30" font-weight="900" fill="#06231B">3</text>
      <text x="98" y="56" font-size="30" font-weight="600" fill="#FFFFFF" fill-opacity="0.94">{{step3}}</text>
    </g>
  </g>

  <!-- ===== Feedback + CTA + footer ===== -->
  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="540" y="1592" font-size="30" font-weight="700" fill="#5FF1C5">{{feedback}}</text>

    <g transform="translate({{ctaX}} 1648)" filter="url(#cta-glow)">
      <rect x="0" y="0" width="{{ctaWidth}}" height="76" rx="38" fill="url(#teal-text)"/>
      <text x="{{ctaHalf}}" y="50" text-anchor="middle" font-size="{{ctaFont}}" font-weight="800" fill="#06231B">{{cta}}  ↓</text>
    </g>
    <text x="{{storesX}}" y="1772" font-size="22" font-weight="600" fill="#FFFFFF" fill-opacity="0.64">{{stores}}</text>

    <text x="540" y="1840" font-size="19" fill="#FFFFFF" fill-opacity="0.5" letter-spacing="0.5"><tspan font-weight="800" fill="#FFFFFF" fill-opacity="0.85">Habit2Goal</tspan>  ·  {{tagline}}</text>
  </g>
</svg>
